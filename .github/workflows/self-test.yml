name: self-test

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run self-test
        run: python vo2_pace_solver.py --self-test
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the browser port's self-test
        run: node web/vdot.js --self-test
      - name: Cross-check the browser port against the Python CLI
        run: bash tools/parity.sh
      - name: Parity check fails when either side fails
        run: |
          for pair in "false|node web/vdot.js" "python vo2_pace_solver.py|false" "false|false" "true|true"; do
            if PARITY_PY="${pair%%|*}" PARITY_JS="${pair#*|}" bash tools/parity.sh; then
              echo "parity.sh passed with PY='${pair%%|*}' JS='${pair#*|}' -- it must fail"; exit 1
            fi
          done
          echo "parity.sh fails on every broken producer"
